name: 预审批（流程与风险抽取）
description: 将 OA/审批页面内容抽取为“可直接给审批人阅读”的结构化结果，用于预审批 Demo 展示。
url_keyword: oa.ksyun.com

output_spec:
  result_type: object
  required_fields:
    - 流程名称
    - 流程内容
    - 风险等级
    - 风险点
    - 风险依据
    - 流程审批建议
  field_rules:
    流程名称: "从页面标题/流程类型字段中抽取，例如：公章盖章申请、采购付款申请、费用报销、合同审批、请假申请。"
    流程内容: "必须输出。用 6-16 个字高度提炼“这条流程最核心的事项/主题”，例如：战略合作备忘录、新办公区装修尾款、季度常规耗材采购。"
    风险等级: "只能输出：高风险 / 中风险 / 低风险。"
    风险点: "数组。每条 10-28 字，写成审批人能理解的短句（不要写规则编号/公式）。"
    风险依据: "数组。每条说明“为什么这么判”，引用抓取内容里的关键词/字段/句子（用人话），可与风险点一一对应。"
    流程审批建议: "中/低风险必须给出：通过 或 驳回；高风险必须给出：人工复核。"

prompt: |
  你将读取“抓取内容”（来自 OA/审批系统页面渲染后的可见文本）。
  你的目标是生成用于“预审批 Demo”展示的 result 对象。

  重要要求：
  1) 必须输出“流程内容”，且不能是占位符。
  2) 风险点/风险依据必须用人话，避免规则化、公式化表达。
  3) 流程审批建议必须是：通过/驳回/人工复核 之一（不要输出多选）。

  输出 result 的 JSON 结构（字段必须齐全）：
  {
    "流程名称": "...",
    "流程内容": "...",
    "风险等级": "高风险|中风险|低风险",
    "风险点": ["..."],
    "风险依据": ["..."],
    "流程审批建议": "通过|驳回|人工复核"
  }
