<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AI 预审批 Demo（单页 HTML）</title>
            <style>
      :root {
        --c-primary: #3370ff;
        --c-primary-hover: #2a5de6;
        --c-bg: #f8fafc;
        --c-card: rgba(255, 255, 255, 0.7);
        --c-text-1: #0f172a;
        --c-text-2: #475569;
        --c-text-3: #64748b;
        --c-border: rgba(255, 255, 255, 0.8);
        --c-border-solid: #e2e8f0;
        --c-primary-weak: rgba(51, 112, 255, 0.08);

        --c-risk-h: #ef4444;
        --c-risk-m: #f59e0b;
        --c-risk-l: #10b981;
        
        --radius: 16px;
        --shadow-sm: 0 2px 8px -2px rgba(15, 23, 42, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.6);
        --shadow: 0 8px 24px -6px rgba(15, 23, 42, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.8);
        --shadow-lg: 0 16px 40px -8px rgba(15, 23, 42, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.9);
        --glass-blur: blur(24px);

        --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display',
          'PingFang SC', 'Hiragino Sans GB', Roboto, 'Noto Sans SC', system-ui, sans-serif;
      }

      body {
        margin: 0;
        background: #e2e8f0;
        font-family: var(--font);
        font-size: 15px;
        color: var(--c-text-1);
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100svh;
      }

      * { box-sizing: border-box; }

      .app-shell {
        width: 100%;
        max-width: 393px;
        height: 100svh;
        max-height: 852px;
        margin: 0 auto;
        background-color: #f8fafc;
        background-image: 
          radial-gradient(at 0% 0%, hsla(210, 100%, 96%, 1) 0px, transparent 50%),
          radial-gradient(at 100% 0%, hsla(250, 100%, 97%, 1) 0px, transparent 50%),
          radial-gradient(at 100% 100%, hsla(210, 100%, 96%, 1) 0px, transparent 50%),
          radial-gradient(at 0% 100%, hsla(200, 40%, 97%, 1) 0px, transparent 50%);
        display: flex;
        flex-direction: column;
        position: relative;
      }

      .app-shell::before, .app-shell::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        z-index: 0;
        pointer-events: none;
        animation: floatOrb 12s ease-in-out infinite alternate;
      }
      .app-shell::before {
        width: 300px; height: 300px;
        background: rgba(56, 189, 248, 0.15);
        top: -50px; left: -100px;
      }
      .app-shell::after {
        width: 350px; height: 350px;
        background: rgba(167, 139, 250, 0.1);
        bottom: 100px; right: -100px;
        animation-delay: -6s;
      }
      @keyframes floatOrb {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(40px, 60px) scale(1.05); }
      }

      @media (min-width: 480px) {
        body { perspective: 1000px; }
        .app-shell {
          border-radius: 40px;
          box-shadow: 0 24px 60px rgba(15, 23, 42, 0.1), 0 0 0 8px rgba(255, 255, 255, 0.6);
          overflow: hidden;
          margin: auto;
          height: 852px;
          min-height: auto;
          transform: scale(min(1, calc((100svh - 80px) / 852)));
          transform-origin: center center;
          border: 1px solid rgba(0, 0, 0, 0.05);
        }
      }

      @media (min-width: 768px) {
        .app-shell { max-width: 393px; }
      }

      .fixed-header {
        flex: none;
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-bottom: 1px solid rgba(255, 255, 255, 0.9);
      }

      .top-hero { padding-top: max(env(safe-area-inset-top), 24px); }
      .top-hero-inner { width: 100%; max-width: 393px; margin: 0 auto; position: relative; z-index: 2; }
      
      .van-nav-bar { height: 46px; display: flex; align-items: center; justify-content: center; position: relative; background: transparent; }
      .van-nav-bar__title { font-size: 17px; font-weight: 800; color: var(--c-text-1); letter-spacing: -0.3px; }

      .top-tabs {
        width: 100%; max-width: 393px; margin: 0 auto;
        padding: 4px 16px 8px; display: flex; align-items: center; gap: 10px;
        position: relative; z-index: 2;
      }
      .tab-group { flex: 1; display: flex; background: rgba(15, 23, 42, 0.04); border-radius: 12px; padding: 4px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.02); }
      .tab {
        flex: 1; border: none; background: transparent;
        border-radius: 10px; height: 32px; font-size: 14px; font-weight: 600; color: var(--c-text-2); cursor: pointer; outline: none; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .tab.active { background: #ffffff; color: var(--c-primary); box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08); font-weight: 700; }

      .tab-count {
        height: 18px;
        padding: 0 8px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.06);
        color: var(--c-text-2);
        font-size: 12px;
        font-weight: 800;
        line-height: 18px;
      }
      .tab.active .tab-count {
        background: rgba(51, 112, 255, 0.12);
        color: var(--c-primary);
      }

      .page-header { padding: 8px 16px 0; position: relative; z-index: 2; }
      .scroll-area { flex: 1; overflow-y: auto; padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; position: relative; z-index: 1; }

      .panel { border: 1px solid var(--c-border); border-radius: var(--radius); background: var(--c-card); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); box-shadow: var(--shadow); overflow: hidden; }
      .row { display: flex; align-items: stretch; padding: 6px 6px; }
      .divider { width: 1px; background: rgba(15,23,42,0.06); margin: 4px 2px; }
      .divider-h { height: 1px; background: rgba(15,23,42,0.06); margin: 0 10px; }
      .seg { flex: 1; border: 0; background: transparent; padding: 8px; text-align: left; cursor: pointer; border-radius: 10px; transition: 0.2s; outline: none; }
      .seg:active { opacity: 0.7; }
      .seg.active { background: rgba(255,255,255,0.8); box-shadow: var(--shadow-sm); }
      .pair { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
      .label { font-size: 14px; color: var(--c-text-2); font-weight: 800; }
      .value { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
      .seg[data-level='high'] .value { color: var(--c-risk-h); }
      .seg[data-level='mid'] .value { color: var(--c-risk-m); }
      .seg[data-level='low'] .value { color: var(--c-risk-l); }

      .toolbar { margin-top: 16px; margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between; position: relative; }
      .toolbar-row { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
      
      .van-dropdown-menu__bar { height: 32px; padding: 0 12px; border-radius: 999px; background: var(--c-card); backdrop-filter: var(--glass-blur); border: 1px solid var(--c-border); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--shadow-sm); transition: 0.2s; }
      .van-dropdown-menu__bar:active { background: rgba(255,255,255,0.9); }
      .van-dropdown-menu__title { font-size: 13px; font-weight: 700; color: var(--c-text-1); display: flex; align-items: center; }
      .van-dropdown-menu__title::after { content: ''; margin-left: 6px; border: 4px solid transparent; border-top-color: var(--c-text-3); transform-origin: center; transition: transform 0.2s; margin-top: 4px; }
      .van-dropdown-menu__title.active::after { transform: rotate(180deg); margin-top: -4px; border-top-color: var(--c-text-1); }
      
      .batch-trigger-btn {
        height: 32px; padding: 0 14px; border-radius: 999px; background: var(--c-card); backdrop-filter: var(--glass-blur); border: 1px solid var(--c-border); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--c-text-1); font-weight: 700; font-size: 13px; box-shadow: var(--shadow-sm); transition: 0.2s;
      }
      .batch-trigger-btn.active { background: var(--c-primary); color: #fff; border-color: var(--c-primary); box-shadow: 0 4px 12px rgba(51,112,255,0.2); }

      .search {
        flex: 1;
        min-width: 0;
        height: 32px;
        padding: 0 12px;
        border-radius: 999px;
        border: 1px solid var(--c-border);
        background: var(--c-card);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--shadow-sm);
        color: var(--c-text-1);
        font-size: 13px;
        font-weight: 600;
        outline: none;
      }
      .search::placeholder { color: var(--c-text-3); font-weight: 600; }
      .search:focus { border-color: rgba(51,112,255,0.35); box-shadow: 0 0 0 3px rgba(51,112,255,0.10), var(--shadow-sm); }
      
      .van-dropdown-item { position: absolute; top: 44px; left: 0; right: 0; z-index: 30; display: none; }
      .van-dropdown-item.open { display: block; }
      .van-dropdown-item__content { width: 100%; background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); border: 1px solid rgba(255, 255, 255, 0.95); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow-lg); }
      
      .van-cell { display: flex; padding: 14px 16px; font-size: 14px; background: transparent; border: none; border-bottom: 1px solid rgba(15,23,42,0.04); width: 100%; text-align: left; align-items: center; justify-content: space-between; cursor: pointer; color: var(--c-text-1); font-weight: 600; transition: 0.2s; }
      .van-cell:last-child { border-bottom: none; }
      .van-cell:active { background: rgba(255, 255, 255, 0.6); }
      .van-cell--active { color: var(--c-primary); }
      .van-cell__value { display: flex; align-items: center; }
      .van-icon-success {
        width: 16px; height: 16px; display: inline-flex; background-color: var(--c-primary);
        mask: url("data:image/svg+xml,%3Csvg viewBox='0 0 1024 1024' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M406.656 706.56l-204.8-204.8 60.314-60.314 144.486 144.486 398.336-398.336 60.314 60.314z'/%3E%3C/svg%3E") no-repeat center / contain;
        -webkit-mask: url("data:image/svg+xml,%3Csvg viewBox='0 0 1024 1024' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M406.656 706.56l-204.8-204.8 60.314-60.314 144.486 144.486 398.336-398.336 60.314 60.314z'/%3E%3C/svg%3E") no-repeat center / contain;
      }

      .van-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.03); backdrop-filter: none; display: none; z-index: 25; }
      .van-overlay.open { display: block; }

      .list { margin-top: 12px; display: grid; gap: 12px; }

      .cell { background: var(--c-card); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--c-border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; position: relative; overflow: hidden; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
      .cell::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: transparent; transition: 0.3s; }
      .cell[data-level='high']::before { background: var(--c-risk-h); }
      .cell[data-level='mid']::before { background: var(--c-risk-m); }
      .cell[data-level='low']::before { background: var(--c-risk-l); }
      .cell[data-expanded='true'] { box-shadow: 0 0 0 2px var(--c-primary), var(--shadow-lg); transform: translateY(-1px); border-color: transparent; }
      .cell:active { transform: scale(0.98); }
      
      .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
      .l { display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
      .r { display: flex; gap: 6px; align-items: center; flex: none; }
      .title { font-size: 16px; font-weight: 800; color: var(--c-text-1); line-height: 1.3; min-width: 0; }
      
      .risk-badge { height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; background: rgba(255,255,255,0.9); box-shadow: var(--shadow-sm); }
      .risk-badge.high { color: #dc2626; border: 1px solid #fecaca; background: #fef2f2; }
      .risk-badge.mid { color: #d97706; border: 1px solid #fde68a; background: #fffbeb; }
      .risk-badge.low { color: #059669; border: 1px solid #bbf7d0; background: #f0fdf4; }
      
      .van-tag { display: inline-flex; align-items: center; padding: 0 6px; height: 20px; font-size: 11px; font-weight: 700; border-radius: 4px; }
      .van-tag--success { background: #f0fdf4; color: #059669; border: 1px solid #bbf7d0; }
      .van-tag--danger { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
      .res { margin-left: 4px; height: 22px; border-radius: 6px; padding: 0 8px; font-weight: 700; }

      .top-suggest { margin-top: 12px; }
      .suggest { display: flex; gap: 8px; align-items: baseline; }
      .suggest .v { font-size: 13px; color: var(--c-text-1); line-height: 1.5; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-weight: 500; }
      .hl-approve { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid #bbf7d0; background: #f0fdf4; color: #059669; font-weight: 700; margin: 0; }
      .hl-reject { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid #fde68a; background: #fffbeb; color: #d97706; font-weight: 700; margin: 0; }
      .hl-immediate { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid #fecaca; background: #fef2f2; color: #dc2626; font-weight: 700; margin: 0; }

      .meta { margin-top: 10px; font-size: 13px; color: var(--c-text-2); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      .meta.compact { margin-top: 12px; }
      .amt { color: var(--c-text-1); font-weight: 700; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .risk-count { color: #dc2626; font-weight: 600; background: #fef2f2; padding: 2px 6px; border-radius: 4px; border: 1px solid #fecaca; }
      
      .sub { margin-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--c-border-solid); padding-top: 10px; }
      .sub.compact { border-top: none; padding-top: 0; }
      .time { font-size: 12px; color: var(--c-text-3); font-weight: 500; }
      
      .mini-actions { display: flex; gap: 8px; align-items: center; }
      .mini-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: stretch; }
      .mini { width: 100%; justify-content: center; border: 1px solid var(--c-border-solid); background: rgba(255,255,255,0.8); color: var(--c-text-2); height: 28px; padding: 0 12px; border-radius: 999px; font-size: 12px; font-weight: 700; cursor: pointer; outline: none; transition: 0.2s; box-shadow: var(--shadow-sm); }
      .mini:active { opacity: 0.8; }
      .mini.active { background: #eff6ff; border-color: #bfdbfe; color: var(--c-primary); }

      .toggles { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .van-button { position: relative; display: inline-flex; box-sizing: border-box; align-items: center; justify-content: center; text-align: center; border: 1px solid var(--c-border-solid); cursor: pointer; transition: all 0.2s; -webkit-appearance: none; background: rgba(255,255,255,0.8); color: var(--c-text-2); font-weight: 700; border-radius: 10px; backdrop-filter: var(--glass-blur); box-shadow: var(--shadow-sm); }
      .van-button:active { transform: scale(0.98); }
      
      .toggle-btn { width: 100%; height: 36px; font-size: 14px; padding: 0 16px; justify-content: center; }
      .toggle-btn.van-button--primary { background: #eff6ff; color: var(--c-primary); border-color: #bfdbfe; }
      
      .inline-actions { margin-top: 12px; display: flex; gap: 8px; }
      .act { height: 38px; font-weight: 800; font-size: 14px; flex: 1; border-radius: 10px; padding: 0; }
      .act[data-act="approve"] { background: var(--c-primary); color: #fff; border: 1px solid var(--c-primary); box-shadow: 0 4px 14px rgba(51,112,255,0.2); }
      .act[data-act="reject"] { background: rgba(255,255,255,0.9); color: #dc2626; border: 1px solid #fecaca; box-shadow: var(--shadow-sm); }

      .expand { margin-top: 12px; display: grid; gap: 10px; }
      .sec { padding: 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.5); border: 1px solid rgba(255,255,255,0.8); box-shadow: inset 0 2px 8px rgba(255,255,255,0.6); }
      .sec-h { font-size: 13px; font-weight: 800; color: var(--c-text-1); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
      .sec-h::before { content: ''; display: block; width: 4px; height: 12px; background: var(--c-primary); border-radius: 2px; }
      .sec-b { font-size: 13px; color: var(--c-text-2); line-height: 1.6; white-space: pre-wrap; }
      
      .risk-list { display: grid; gap: 10px; }
      .risk-row { display: flex; gap: 10px; align-items: flex-start; }
      .rr { flex: 1; min-width: 0; }
      .rk { flex: none; width: 24px; height: 24px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; background: #f1f5f9; border: 1px solid #e2e8f0; color: var(--c-text-3); }
      .rk[data-level='high'] { background: #fef2f2; color: #dc2626; border-color: #fecaca; }
      .rk[data-level='mid'] { background: #fffbeb; color: #d97706; border-color: #fde68a; }
      .rk[data-level='low'] { background: #f0fdf4; color: #059669; border-color: #bbf7d0; }
      .rt { font-size: 14px; color: var(--c-text-1); font-weight: 700; line-height: 1.4; margin-top: 2px; }
      .rd { margin-top: 4px; font-size: 13px; color: var(--c-text-2); line-height: 1.5; }

      .empty { padding: 48px 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--c-text-3); font-size: 15px; font-weight: 600; }
      
      .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 80px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); color: #fff; padding: 12px 20px; border-radius: 12px; font-size: 14px; z-index: 2000; opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none; text-align: center; max-width: 80%; font-weight: 600; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }

      .checkbox { width: 24px; height: 24px; border-radius: 8px; border: 2px solid rgba(15,23,42,0.15); display: flex; align-items: center; justify-content: center; flex: none; transition: 0.2s; background: rgba(255,255,255,0.9); margin-right: 4px; }
      .checkbox.checked { background: var(--c-primary); border-color: var(--c-primary); box-shadow: 0 2px 8px rgba(51,112,255,0.25); }
      .checkbox.checked::after { content: ''; width: 10px; height: 5px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translateY(-1px) translateX(1px); }

      .card-wrap { display: flex; align-items: center; gap: 8px; }
      .card-wrap .checkbox-col { flex: none; display: flex; align-items: center; justify-content: center; width: 28px; }
      .card-wrap .cell { flex: 1; min-width: 0; }

      .bottom-bar, .all-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border-top: 1px solid rgba(255,255,255,0.9);
        padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
        display: flex;
        gap: 12px;
        z-index: 30;
        transform: translateY(100%);
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 -10px 40px rgba(15, 23, 42, 0.05);
      }
      .bottom-bar.show, .all-bar:not(.hide) {
        transform: translateY(0);
      }
      .all-bar.hide { transform: translateY(100%); }
      
      .bottom-bar .van-button, .all-bar .van-button { flex: 1; height: 42px; border-radius: 12px; font-weight: 800; font-size: 14px; padding: 0; border: none; }
      .van-button--primary { background: var(--c-primary); color: #fff; box-shadow: 0 4px 14px rgba(51,112,255,0.2); }
      .van-button--danger { background: rgba(255,255,255,0.9); color: #dc2626; border: 1px solid rgba(239,68,68,0.35); box-shadow: var(--shadow-sm); }
      .van-button--plain.van-button--primary { background: rgba(255,255,255,0.9); color: var(--c-primary); border: 1px solid rgba(51,112,255,0.25); box-shadow: var(--shadow-sm); }

      .van-button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    </style>
  </head>
  <body>
    <div class="app-shell" id="app">
      <div class="fixed-header">
        <div class="top-hero">
          <div class="top-hero-inner">
            <div class="van-nav-bar">
              <div class="van-nav-bar__title" id="navTitle">流程中心</div>
            </div>
          </div>
        </div>

        <div class="top-tabs" role="tablist" aria-label="待办与已办">

        } catch {

      const fmtTime = (iso) => {
        const d = new Date(iso);
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const hh = String(d.getHours()).padStart(2, '0');
        const mi = String(d.getMinutes()).padStart(2, '0');
        return `${mm}/${dd} ${hh}:${mi}`;
      };

      const normalizeSuggestion = (s, riskLevel) => {
        let out = (s || '建议复核关键信息后决策').replace(/复核金额偏差后/g, '注意符合金额偏差').replace(/立即处理/g, 'AI 风险阻断：');
        if (riskLevel === 'high') out = out.replace(/转人工核验/g, '重点核验').replace(/转人工/g, '重点核验');
        out = out.replace(/建议通过/g, 'AI 建议通过').replace(/建议驳回/g, 'AI 建议驳回');
        out = out.replace(/AI\s+AI/g, 'AI');
        return out;
      };

        // Find the boundary between the main suggestion and the details (if any)
        // This regex looks for an opening parenthesis, whether full-width or half-width
        const match = s.match(/^([^(（]+)(?:[((（](.*)[))）])?$/);
        
        if (match) {
          const mainSuggestion = match[1].trim();
          const details = match[2] ? match[2].trim() : '';
          
          let tone = '';
          if (mainSuggestion.includes('AI 建议通过')) tone = 'approve';
          else if (mainSuggestion.includes('AI 建议驳回')) tone = 'reject';
          else if (mainSuggestion.includes('AI 风险阻断')) tone = 'immediate';
          
          const tokens = [];
          if (tone) {
            tokens.push({ t: mainSuggestion, tone });
          } else {
            tokens.push({ t: mainSuggestion });
          }
          
          if (details) {
            tokens.push({ t: ` （${details}）` });
          }
          
          return tokens;
        }
        
        return [{ t: String(s) }];

          riskLevel: 'low', aiSummary: '邀约人: 王五\n邀约部门: King/财务部\n来访事由: 年度财务审计驻场\n来访时间: 2026-04-10 至 2026-05-30\n来访人数: 6 人\n对方单位: 普华永道中天会计师事务所\n接待区域: 8楼独立会议室\n所属公司: King 公司', preApprovalSuggestion: 'AI 建议通过', riskItems: [],
          riskSummary: '四大审计团队驻场办公邀约，人员信息已报备，符合门禁要求；无异常风险项。', status: 'done', decision: 'approved', decidedAtISO: new Date(Date.now() - 1000 * 60 * 60 * 24 * 4 + 1000 * 60 * 12).toISOString(),
        },
        {
          id: 'a-done-004', title: '费用报销 · 员工团建经费（已办）', applicantName: '张三', applicantDept: '研发部', amountCny: 4500, createdAtISO: new Date(Date.now() - 1000 * 60 * 60 * 24 * 6).toISOString(),
          riskLevel: 'low', aiSummary: '报销人: 张三\n报销部门: King/研发部\n报销事由: 研发一组春季部门团建\n实际报销金额: 4,500.00\n货币类型: 人民币\n所属公司: King 公司\n结算方式: 银行代发\n收款方: 个人\n收款单位: 张三', preApprovalSuggestion: 'AI 建议通过', riskItems: [],
          riskSummary: '发票齐全，人均额度符合团建标准，参与人员名单完整；无异常风险项。', status: 'done', decision: 'approved', decidedAtISO: new Date(Date.now() - 1000 * 60 * 60 * 24 * 6 + 1000 * 60 * 18).toISOString(),
        },
        {
          id: 'a-done-005', title: '请假申请 · 产假 98 天（已办）', applicantName: '李四', applicantDept: '客服部', createdAtISO: new Date(Date.now() - 1000 * 60 * 60 * 24 * 5).toISOString(),
          riskLevel: 'low', aiSummary: '申请人: 李四\n申请部门: King/客服部\n请假类型: 产假\n请假时间: 2026-05-01 至 2026-08-06 (共98天)\n请假事由: 预产期临近，申请法定产假\n工作交接人: 王五\n所属公司: King 公司\n结算方式: 正常薪资发放规则', preApprovalSuggestion: 'AI 建议通过', riskItems: [],
          riskSummary: '请假类型合规，医疗证明材料已上传且核验无误，工作交接清晰；无异常风险项。', status: 'done', decision: 'approved', decidedAtISO: new Date(Date.now() - 1000 * 60 * 60 * 24 * 5 + 1000 * 60 * 22).toISOString(),
        }
      ];

      const state = {
        tab: 'todo',
        risk: 'all',
        suggest: 'all',
        sort: 'risk',
        q: '',
        expandedRisk: new Set(),
        expandedAi: new Set(),
        batchMode: false,
        selected: new Set(),
        items: seed.map((x) => ({ ...x })),
      };

      const el = {
        tabTodoCnt: document.getElementById('tabTodoCnt'),
        tabDoneCnt: document.getElementById('tabDoneCnt'),
        sugPass: document.getElementById('sugPass'),
        sugReject: document.getElementById('sugReject'),
        sugManual: document.getElementById('sugManual'),
        cntSugPass: document.getElementById('cntSugPass'),
        cntSugReject: document.getElementById('cntSugReject'),
        cntSugManual: document.getElementById('cntSugManual'),
        navTitle: document.getElementById('navTitle'),
        tabTodo: document.getElementById('tabTodo'),
        tabDone: document.getElementById('tabDone'),
        riskHigh: document.getElementById('riskHigh'),
        riskMid: document.getElementById('riskMid'),
        riskLow: document.getElementById('riskLow'),
        cntHigh: document.getElementById('cntHigh'),
        cntMid: document.getElementById('cntMid'),
        cntLow: document.getElementById('cntLow'),
        list: document.getElementById('list'),
        scrollArea: document.getElementById('scrollArea'),
        batchBtn: document.getElementById('batchBtn'),
        bottomBar: document.getElementById('bottomBar'),
        btnBatchApprove: document.getElementById('btnBatchApprove'),
        btnBatchReject: document.getElementById('btnBatchReject'),
        btnBatchAI: document.getElementById('btnBatchAI'),
        allBar: document.getElementById('allBar'),
        btnAllApprove: document.getElementById('btnAllApprove'),
        btnAllReject: document.getElementById('btnAllReject'),
        btnAllAI: document.getElementById('btnAllAI'),
        sortBtn: document.getElementById('sortBtn'),
        searchInput: document.getElementById('searchInput'),
        sortPanel: document.getElementById('sortPanel'),
        sortText: document.getElementById('sortText'),
        overlay: document.getElementById('overlay'),
        toast: document.getElementById('toast'),
      };

      const toast = (msg) => {
        el.toast.textContent = msg;
        el.toast.classList.add('show');
        window.clearTimeout(toast._t);
        toast._t = window.setTimeout(() => el.toast.classList.remove('show'), 1400);
      };

      const setTab = (tab) => {
        state.tab = tab;
        state.risk = 'all';
        state.suggest = 'all';
        state.sort = 'risk';
        state.q = '';
        if (el.searchInput) el.searchInput.value = '';
        el.tabTodo.classList.toggle('active', tab === 'todo');
        el.tabTodo.setAttribute('aria-selected', String(tab === 'todo'));
        el.tabDone.classList.toggle('active', tab === 'done');
        el.tabDone.setAttribute('aria-selected', String(tab === 'done'));
        el.navTitle.textContent = '流程中心';
        state.expandedRisk.clear();
        state.expandedAi.clear();
        state.batchMode = false;
        state.selected.clear();
        render();
      };

      const toggleRiskFilter = (level) => {
        if (state.suggest !== 'all') state.suggest = 'all';
        state.risk = state.risk === level ? 'all' : level;
        render();
      };

      const setSuggestFilter = (k) => {
        if (state.risk !== 'all') state.risk = 'all';
        state.suggest = state.suggest === k ? 'all' : k;
        render();
      };

      const sortText = (k) => {
        if (k === 'risk') return '风险优先';
        if (k === 'time_desc') return state.tab === 'done' ? '新审批在前' : '刚发起的在前';
        if (k === 'time_asc') return state.tab === 'done' ? '旧审批在前' : '积压最久的在前';
        if (k === 'amount_desc') return '金额高';
        return '金额低';
      };

      const openDropdown = () => {
        el.sortPanel.classList.add('open');
        el.overlay.classList.add('open');
        el.sortBtn.querySelector('.van-dropdown-menu__title').classList.add('active');
      };
      const closeDropdown = () => {
        el.sortPanel.classList.remove('open');
        el.overlay.classList.remove('open');
        el.sortBtn.querySelector('.van-dropdown-menu__title').classList.remove('active');
      };

      const applySort = (list) => {
        const byRisk = (x) => (x.riskLevel === 'high' ? 3 : x.riskLevel === 'mid' ? 2 : 1);
        const byTime = (x) => new Date(x.createdAtISO).getTime();
        const byAmount = (x) => {
          if (x.amountCny === null || x.amountCny === undefined) return -1;
          return Number(x.amountCny);
        };
        const k = state.sort;
        
        // Make a fresh copy to sort
        const out = Array.from(list);
        
        out.sort((a, b) => {
          if (k === 'risk') {
            const riskDiff = byRisk(b) - byRisk(a);
            return riskDiff !== 0 ? riskDiff : byTime(b) - byTime(a);
          }
          if (k === 'time_desc') return byTime(b) - byTime(a);
          if (k === 'time_asc') return byTime(a) - byTime(b);
          if (k === 'amount_desc') return byAmount(b) - byAmount(a);
          if (k === 'amount_asc') return byAmount(a) - byAmount(b);
          return 0;
        });
        return out;
      };

      const decisionLabel = (d) => (d === 'approved' ? '通过' : d === 'rejected' || d === 'transferred' ? '驳回' : '');
      const decisionTone = (d) => (d === 'rejected' || d === 'transferred' ? 'danger' : 'success');

      const suggestionKind = (it) => {
        const s = normalizeSuggestion(it.preApprovalSuggestion || '', it.riskLevel);
        if (/^AI\s*建议通过/.test(s)) return 'pass';
        if (/^AI\s*建议驳回/.test(s)) return 'reject';
        return 'manual';
      };

      const matchesSearch = (it, q) => {
        const needle = String(q || '').trim().toLowerCase();
        if (!needle) return true;

        const hay = [];
        hay.push(it.title, it.applicantName, it.applicantDept);
        hay.push(it.preApprovalSuggestion);
        hay.push(it.aiSummary);
        hay.push(it.riskSummary);
        if (it.amountCny != null) hay.push(String(it.amountCny), fmtCny(it.amountCny));
        if (Array.isArray(it.riskItems)) {
          for (const ri of it.riskItems) {
            hay.push(ri.title, ri.description);
          }
        }
        return hay.filter(Boolean).some((s) => String(s).toLowerCase().includes(needle));
      };

      const renderCounts = () => {
        const tabCnt = { todo: 0, done: 0 };
        const riskCnt = { high: 0, mid: 0, low: 0 };
        const sugCnt = { pass: 0, reject: 0, manual: 0 };

        for (const it of state.items) {
          if (it.status === 'todo') tabCnt.todo += 1;
          if (it.status === 'done') tabCnt.done += 1;

          if (it.status !== state.tab) continue;
          if (!matchesSearch(it, state.q)) continue;
          const k = suggestionKind(it);

          if (state.suggest === 'all' || k === state.suggest) {
            riskCnt[it.riskLevel] += 1;
          }
          if (state.risk === 'all' || it.riskLevel === state.risk) {
            sugCnt[k] += 1;
          }
        }

        el.tabTodoCnt.textContent = String(tabCnt.todo);
        el.tabDoneCnt.textContent = String(tabCnt.done);

        el.cntHigh.textContent = String(riskCnt.high);
        el.cntMid.textContent = String(riskCnt.mid);
        el.cntLow.textContent = String(riskCnt.low);

        el.cntSugPass.textContent = String(sugCnt.pass);
        el.cntSugReject.textContent = String(sugCnt.reject);
        el.cntSugManual.textContent = String(sugCnt.manual);

        el.sugPass.classList.toggle('active', state.suggest === 'pass');
        el.sugReject.classList.toggle('active', state.suggest === 'reject');
        el.sugManual.classList.toggle('active', state.suggest === 'manual');
        el.riskHigh.classList.toggle('active', state.risk === 'high');
        el.riskMid.classList.toggle('active', state.risk === 'mid');
        el.riskLow.classList.toggle('active', state.risk === 'low');
      };

      const renderDropdown = () => {
        el.sortText.textContent = sortText(state.sort);
        const isDone = state.tab === 'done';
        const timeDesc = el.sortPanel.querySelector('.van-cell[data-sort="time_desc"] .van-cell__title span');
        const timeAsc = el.sortPanel.querySelector('.van-cell[data-sort="time_asc"] .van-cell__title span');
        if (timeDesc) timeDesc.textContent = isDone ? '新审批在前' : '刚发起的在前';
        if (timeAsc) timeAsc.textContent = isDone ? '旧审批在前' : '积压最久的在前';
        const opts = el.sortPanel.querySelectorAll('.van-cell');
        opts.forEach((btn) => {
          const k = btn.getAttribute('data-sort');
          const isAct = k === state.sort;
          btn.classList.toggle('van-cell--active', isAct);
          btn.querySelector('.van-icon-success').style.display = isAct ? 'inline-flex' : 'none';
        });
      };

      const toggleExpand = (kind, id) => {
        const set = kind === 'risk' ? state.expandedRisk : state.expandedAi;
        if (set.has(id)) set.delete(id);
        else set.add(id);
        render();
      };

      const confirmYesNo = (msg) => {
        return window.confirm(msg);
      };

      const decide = (id, d) => {
        const it = state.items.find((x) => x.id === id);
        if (!it) return;
        it.status = 'done';
        it.decision = d;
        it.decidedAtISO = new Date().toISOString();
        toast(d === 'approved' ? '已通过' : '已驳回');
        render();
      };

      const renderCard = (it) => {
        const isDone = it.status === 'done';
        const doneDecisionLabelStr = isDone && it.decision ? decisionLabel(it.decision) : '';
        const doneDecisionToneStr = decisionTone(it.decision);
        
        const riskBadgeName = it.riskLevel === 'high' ? '高' : it.riskLevel === 'mid' ? '中' : '低';
        
        const sug = normalizeSuggestion(it.preApprovalSuggestion, it.riskLevel);
        const tokens = tokenizeSuggestion(sug)
          .map((x) => {
            if (!x.tone) return `<span>${x.t}</span>`;
            return `<span class="hl-${x.tone}">${x.t}</span>`;
          })
          .join('');

        const metaParts = [
          `<span>${it.applicantName}</span>`,
          `<span>·</span>`,
          `<span>${it.applicantDept}</span>`,
        ];
        if (it.amountCny != null) {
          metaParts.push(`<span>·</span>`, `<span class="amt">${fmtCny(it.amountCny)}</span>`);
        }
        
        if (it.riskItems.length > 0) {
          metaParts.push(`<span>·</span>`, `<span class="risk-count">风险 ${it.riskItems.length} 项</span>`);
        }

        const riskOn = state.expandedRisk.has(it.id);
        const aiOn = state.expandedAi.has(it.id);
        const isSelected = state.selected.has(it.id);

        let content = '';
        
        const checkboxHtml = (!isDone && state.batchMode) ? `
          <div class="checkbox-col" data-act="toggle-select" data-id="${it.id}" style="cursor:pointer; align-self: stretch;">
            <div class="checkbox ${isSelected ? 'checked' : ''}"></div>
          </div>
        ` : '';

        if (isDone) {
          content += `
            <div class="meta compact">
              ${metaParts.join('')}
            </div>
            <div class="sub compact">
              <span class="time">完成于 ${fmtTime(it.decidedAtISO || it.createdAtISO)}</span>
              <div class="mini-actions">
                <button class="mini ${aiOn ? 'active' : ''}" data-act="toggle-ai" data-id="${it.id}">AI 摘要</button>
                <button class="mini ${riskOn ? 'active' : ''}" data-act="toggle-risk" data-id="${it.id}">AI 风险提醒</button>
              </div>
            </div>
          `;
        } else {
          content += `
            <div class="suggest top-suggest">
              <span class="v">${tokens}</span>
            </div>
            <div class="meta">
              ${metaParts.join('')}
            </div>
            <div class="sub">
              <span class="time">提交于 ${fmtTime(it.createdAtISO)}</span>
            </div>
            <div class="toggles">
              <button class="van-button toggle-btn ${aiOn ? 'van-button--primary' : 'van-button--default'}" data-act="toggle-ai" data-id="${it.id}">AI 摘要</button>
              <button class="van-button toggle-btn ${riskOn ? 'van-button--primary' : 'van-button--default'}" data-act="toggle-risk" data-id="${it.id}">AI 风险提醒</button>
            </div>
          `;
        }

        const expanded = (riskOn || aiOn) ? `
          <div class="expand">
            ${aiOn ? `
              <div class="sec">
                <div class="sec-h">AI 摘要</div>
                <div class="sec-b" style="display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px;">
                  ${it.aiSummary ? it.aiSummary.split('\n').map(line => {
                    const [label, value] = line.split(': ');
                    return `<span style="color: var(--c-text-3); white-space: nowrap;">${label}:</span><span style="color: var(--c-text-1); font-weight: 500;">${value || ''}</span>`;
                  }).join('') : '暂无'}
                </div>
              </div>
            ` : ''}
            ${riskOn ? `
              <div class="sec">
                <div class="sec-h">风险项（${it.riskItems.length}）</div>
                ${it.riskItems.length === 0 ? `<div class="sec-b">无风险项</div>` : `
                  <div class="risk-list">
                    ${it.riskItems.map(ri => `
                      <div class="risk-row">
                        <span class="rk" data-level="${ri.level}">${ri.level === 'high' ? '高' : ri.level === 'mid' ? '中' : '低'}</span>
                        <div class="rr">
                          <div class="rt">${ri.title}</div>
                          <div class="rd">${ri.description}</div>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                `}
                ${it.riskSummary ? `<div class="sec-b" style="margin-top: 10px; padding-top: 10px; border-top: 1px dashed rgba(15, 23, 42, 0.08);"><strong>总结：</strong>${it.riskSummary}</div>` : ''}
              </div>
            ` : ''}
          </div>
        ` : '';

        const todoActions = (!isDone && !state.batchMode) ? `
          <div class="inline-actions">
            <button class="van-button act" data-act="approve" data-id="${it.id}">同意</button>
            <button class="van-button act" data-act="reject" data-id="${it.id}">驳回</button>
          </div>
        ` : '';

        return `
          <div class="card-wrap">
            ${checkboxHtml}
            <div class="cell" data-level="${it.riskLevel}" data-expanded="${riskOn || aiOn}" ${state.batchMode && !isDone ? `data-act="toggle-select" data-id="${it.id}" style="cursor:pointer;"` : ''}>
              <div class="top">
                <div class="l">
                  <div class="title">${it.title}</div>
                </div>
                <div class="r">
                  <div class="risk-badge ${it.riskLevel}">${riskBadgeName}风险</div>
                  ${isDone && doneDecisionLabelStr ? `<span class="van-tag van-tag--${doneDecisionToneStr} res">${doneDecisionLabelStr}</span>` : ''}
                </div>
              </div>
              ${content}
              ${expanded}
              ${todoActions}
            </div>
          </div>
        `;
      };

      const render = () => {
        renderCounts();
        renderDropdown();

        let filtered = state.items.filter((x) => x.status === state.tab);
        filtered = filtered.filter((x) => matchesSearch(x, state.q));
        if (state.risk !== 'all') filtered = filtered.filter((x) => x.riskLevel === state.risk);
        if (state.suggest !== 'all') filtered = filtered.filter((x) => suggestionKind(x) === state.suggest);
        
        const sortedList = applySort(filtered);

        if (state.tab === 'todo') {
          el.batchBtn.style.display = 'flex';
          el.batchBtn.textContent = state.batchMode ? '取消选择' : '批量选择';
          el.batchBtn.classList.toggle('active', state.batchMode);
          
          if (sortedList.length === 0) {
            el.allBar.classList.add('hide');
          } else {
            el.allBar.classList.toggle('hide', state.batchMode);
          }
        } else {
          el.batchBtn.style.display = 'none';
          el.allBar.classList.add('hide');
        }
        
        if (state.tab === 'todo' && state.batchMode) {
          el.bottomBar.classList.add('show');
          el.scrollArea.style.paddingBottom = '80px';
          const count = state.selected.size;
          el.btnBatchApprove.disabled = count === 0;
          el.btnBatchReject.disabled = count === 0;
          el.btnBatchAI.disabled = count === 0;
          el.btnBatchApprove.textContent = `批量同意(${count})`;
          el.btnBatchReject.textContent = `批量驳回(${count})`;
          el.btnBatchAI.textContent = `批量接受AI建议(${count})`;
        } else if (state.tab === 'todo' && !state.batchMode && sortedList.length > 0) {
          el.bottomBar.classList.remove('show');
          el.scrollArea.style.paddingBottom = '80px';
        } else {
          el.bottomBar.classList.remove('show');
          el.scrollArea.style.paddingBottom = 'calc(18px + env(safe-area-inset-bottom))';
        }

        if (sortedList.length === 0) {
          el.list.innerHTML = `<div class="empty">暂无数据</div>`;
          return;
        }
        
        el.list.innerHTML = sortedList.map(renderCard).join('');
      };

      el.tabTodo.addEventListener('click', () => setTab('todo'));
      el.tabDone.addEventListener('click', () => setTab('done'));

      el.sugPass.addEventListener('click', () => setSuggestFilter('pass'));
      el.sugReject.addEventListener('click', () => setSuggestFilter('reject'));
      el.sugManual.addEventListener('click', () => setSuggestFilter('manual'));

      el.riskHigh.addEventListener('click', () => toggleRiskFilter('high'));
      el.riskMid.addEventListener('click', () => toggleRiskFilter('mid'));
      el.riskLow.addEventListener('click', () => toggleRiskFilter('low'));

      el.sortBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (el.sortPanel.classList.contains('open')) closeDropdown();
        else openDropdown();
      });

      el.searchInput.addEventListener('input', () => {
        state.q = (el.searchInput.value || '').trim();
        render();
      });

      el.sortPanel.addEventListener('click', (e) => {
        const btn = e.target.closest('.van-cell');
        if (!btn) return;
        e.stopPropagation();
        state.sort = btn.getAttribute('data-sort');
        closeDropdown();
        render();
      });

      el.overlay.addEventListener('click', closeDropdown);

      el.list.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-act]');
        if (!btn) return;
        const act = btn.getAttribute('data-act');
        const id = btn.getAttribute('data-id');
        if (!id) return;
        if (act === 'toggle-risk') {
          e.stopPropagation();
          return toggleExpand('risk', id);
        }
        if (act === 'toggle-ai') {
          e.stopPropagation();
          return toggleExpand('ai', id);
        }
        if (act === 'toggle-select') {
          if (state.selected.has(id)) state.selected.delete(id);
          else state.selected.add(id);
          render();
          return;
        }
        if (act === 'approve') {
          if (!confirmYesNo('确认同意该审批吗？')) return;
          return decide(id, 'approved');
        }
        if (act === 'reject') {
          if (!confirmYesNo('确认驳回该审批吗？')) return;
          return decide(id, 'rejected');
        }
      });

      el.batchBtn.addEventListener('click', () => {
        state.batchMode = !state.batchMode;
        state.selected.clear();
        render();
      });

      el.btnBatchApprove.addEventListener('click', () => {
        if (state.selected.size === 0) return;
        if (!confirmYesNo(`确认批量同意选中的 ${state.selected.size} 个审批吗？`)) return;
        let processed = 0;
        for (const id of state.selected) {
          const it = state.items.find(x => x.id === id);
          if (it && it.status !== 'done') {
            it.decision = 'approved';
            it.status = 'done';
            it.decidedAtISO = new Date().toISOString();
            processed++;
          }
        }
        state.batchMode = false;
        state.selected.clear();
        toast(`已批量同意 ${processed} 条`);
        render();
      });

      el.btnBatchReject.addEventListener('click', () => {
        if (state.selected.size === 0) return;
        if (!confirmYesNo(`确认批量驳回选中的 ${state.selected.size} 个审批吗？`)) return;
        let processed = 0;
        for (const id of state.selected) {
          const it = state.items.find(x => x.id === id);
          if (it && it.status !== 'done') {
            it.decision = 'rejected';
            it.status = 'done';
            it.decidedAtISO = new Date().toISOString();
            processed++;
          }
        }
        state.batchMode = false;
        state.selected.clear();
        toast(`已批量驳回 ${processed} 条`);
        render();
      });

      el.btnBatchAI.addEventListener('click', () => {
        if (state.selected.size === 0) return;
        
        let actionableCount = 0;
        for (const id of state.selected) {
          const it = state.items.find(x => x.id === id);
          if (it && it.status !== 'done') {
            const sug = it.preApprovalSuggestion || '';
            if (sug.includes('AI 建议通过') || sug.includes('AI 建议驳回')) {
              actionableCount++;
            }
          }
        }

        if (actionableCount === 0) {
          toast('当前选中的审批中没有可由 AI 自动处理的明确建议');
          return;
        }

        if (!confirmYesNo(`确认按照 AI 建议批量处理选中的审批吗？\n（将自动处理 ${actionableCount} 条明确同意/驳回的审批，跳过 ${state.selected.size - actionableCount} 条需人工核验的审批）`)) return;
        
        let processed = 0;
        let skipped = 0;
        for (const id of state.selected) {
          const it = state.items.find(x => x.id === id);
          if (it && it.status !== 'done') {
            const sug = it.preApprovalSuggestion || '';
            if (sug.includes('AI 建议通过')) {
              it.decision = 'approved';
              it.status = 'done';
              it.decidedAtISO = new Date().toISOString();
              processed++;
            } else if (sug.includes('AI 建议驳回')) {
              it.decision = 'rejected';
              it.status = 'done';
              it.decidedAtISO = new Date().toISOString();
              processed++;
            } else {
              skipped++;
            }
          }
        }
        state.batchMode = false;
        state.selected.clear();
        toast(`已根据 AI 建议处理 ${processed} 条` + (skipped > 0 ? `，跳过 ${skipped} 条需人工核验` : ''));
        render();
      });

      el.btnAllApprove.addEventListener('click', () => {
        let list = state.items.filter((x) => x.status === 'todo');
        if (state.risk !== 'all') list = list.filter((x) => x.riskLevel === state.risk);
        if (list.length === 0) return;
        
        // 必须让弹窗立刻执行并阻塞，防止异步造成变量/状态脱节
        if (!confirmYesNo(`确认将当前列表中的 ${list.length} 个待办全部同意吗？`)) return;
        
        let processed = 0;
        for (const it of list) {
          it.decision = 'approved';
          it.status = 'done';
          it.decidedAtISO = new Date().toISOString();
          processed++;
        }
        toast(`已全部同意 ${processed} 条`);
        render();
      });

      el.btnAllReject.addEventListener('click', () => {
        let list = state.items.filter((x) => x.status === 'todo');
        if (state.risk !== 'all') list = list.filter((x) => x.riskLevel === state.risk);
        if (list.length === 0) return;
        
        if (!confirmYesNo(`确认将当前列表中的 ${list.length} 个待办全部驳回吗？`)) return;
        
        let processed = 0;
        for (const it of list) {
          it.decision = 'rejected';
          it.status = 'done';
          it.decidedAtISO = new Date().toISOString();
          processed++;
        }
        toast(`已全部驳回 ${processed} 条`);
        render();
      });

      el.btnAllAI.addEventListener('click', () => {
        let list = state.items.filter((x) => x.status === 'todo');
        if (state.risk !== 'all') list = list.filter((x) => x.riskLevel === state.risk);
        if (list.length === 0) return;
        
        let actionableCount = 0;
        for (const it of list) {
          const sug = it.preApprovalSuggestion || '';
          if (sug.includes('AI 建议通过') || sug.includes('AI 建议驳回')) {
            actionableCount++;
          }
        }
        
        if (actionableCount === 0) {
          toast('当前列表中没有可由 AI 自动处理的明确建议');
          return;
        }

        if (!confirmYesNo(`确认按照 AI 建议将当前列表中的待办进行处理吗？\n（将自动处理 ${actionableCount} 条明确同意/驳回的审批，跳过 ${list.length - actionableCount} 条需人工核验的审批）`)) return;
        
        let processed = 0;
        let skipped = 0;
        for (const it of list) {
          const sug = it.preApprovalSuggestion || '';
          if (sug.includes('AI 建议通过')) {
            it.decision = 'approved';
            it.status = 'done';
            it.decidedAtISO = new Date().toISOString();
            processed++;
          } else if (sug.includes('AI 建议驳回')) {
            it.decision = 'rejected';
            it.status = 'done';
            it.decidedAtISO = new Date().toISOString();
            processed++;
          } else {
            skipped++;
          }
        }
        toast(`已根据 AI 建议处理 ${processed} 条` + (skipped > 0 ? `，跳过 ${skipped} 条需人工核验` : ''));
        render();
      });

      render();
    </script>
  </body>
</html>
